
general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after wake
}

# Dim screen after 10 minutes
listener {
    timeout = 600                                
    on-timeout = brightnessctl set 10%          # set monitor brightness to 10%
    on-resume = brightnessctl set 100%          # restore monitor brightness
}

# Lock screen after 15 minutes
listener {
    timeout = 900                                
    on-timeout = loginctl lock-session          # command to lock
}

# Turn off screen after 20 minutes
listener {
    timeout = 1200                                
    on-timeout = hyprctl dispatch dpms off      # command to turn off screen
    on-resume = hyprctl dispatch dpms on        # command to turn on screen
}

# Suspend system after 25 minutes
listener {
    timeout = 1500                                
    on-timeout = systemctl suspend              # suspend system
}
